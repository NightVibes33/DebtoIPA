name: CI

on:
  push:
    branches: [main, feature/full-converter-app, feature/source-assisted-stock-ios-port]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Type-check web app
        run: npm run typecheck

      - name: Build production web app
        run: npm run build

      - name: Test converter and source-port policy
        run: npm run test:converter

      - name: Validate runner workflow YAML
        run: |
          ruby -e "require 'yaml'; %w[.github/workflows/convert.yml .github/workflows/public-convert.yml].each { |path| YAML.load_file(path, aliases: true); puts \"#{path} parsed\" }"

      - name: Validate shipped browser JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const [path, markers] of [
            ['public/github-runner.html', ['Build on GitHub macOS', 'actions/workflows/convert.yml/dispatches']],
            ['public/public-runner.html', ['Continue with GitHub', '/api/oauth/device', 'debtoipa-uploads', 'public-convert.yml']],
          ]) {
            const html = fs.readFileSync(path, 'utf8');
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((match) => match[1]);
            if (scripts.length !== 1) throw new Error(`${path}: expected one inline script, found ${scripts.length}`);
            new Function(scripts[0]);
            for (const required of markers) {
              if (!html.includes(required)) throw new Error(`${path}: missing contract marker ${required}`);
            }
          }
          const workflow = fs.readFileSync('.github/workflows/public-convert.yml', 'utf8');
          for (const marker of ['runner_full_auto.py', 'source-ported', 'original-blocked']) {
            if (!workflow.includes(marker)) throw new Error(`public workflow missing ${marker}`);
          }
          const config = JSON.parse(fs.readFileSync('public/oauth-config.json', 'utf8'));
          if (!Array.isArray(config.scopes) || !config.scopes.includes('public_repo')) throw new Error('OAuth config must request public_repo.');
          console.log('Static runner clients parsed successfully.');
          NODE

  source-port-iphoneos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile Swift and Objective-C source DEBs for iPhoneOS
        run: python3 tests/macos_source_port_smoke.py
