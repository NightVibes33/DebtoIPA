name: CI

on:
  push:
    branches: [main, feature/full-converter-app]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Type-check web app
        run: npm run typecheck

      - name: Build production web app
        run: npm run build

      - name: Test converter
        run: npm run test:converter

      - name: Validate runner workflow YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.github/workflows/convert.yml', aliases: true); puts 'convert.yml parsed'"

      - name: Validate shipped browser JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/github-runner.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((match) => match[1]);
          if (scripts.length !== 1) throw new Error(`Expected one inline script, found ${scripts.length}`);
          new Function(scripts[0]);
          for (const required of ['Build on GitHub macOS', 'source_kind', 'git_chunks', 'actions/workflows/convert.yml/dispatches']) {
            if (!html.includes(required)) throw new Error(`Missing static client contract marker: ${required}`);
          }
          console.log('Static GitHub runner client parsed successfully.');
          NODE
