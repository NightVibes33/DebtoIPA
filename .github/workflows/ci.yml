name: CI

on:
  push:
    branches: [main, feature/full-converter-app]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Type-check web app
        run: npm run typecheck

      - name: Build production web app
        run: npm run build

      - name: Test converter
        run: npm run test:converter
