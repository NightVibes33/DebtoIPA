name: Probe FlekSt0re IPA downloads
on:
  push:
    branches: [flekstore-alt-source]
    paths:
      - .github/workflows/probe-flekstore-download.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe new FlekSt0re API
        run: |
          python - <<'PY'
          import requests, json
          urls=[
            'https://nestapitest.flekstore.com/app/with-link?filter=updates&page=0&search=deck',
            'https://nestapi.flekstore.com/app/with-link?filter=updates&page=0&search=deck',
          ]
          for url in urls:
            print('\nURL',url)
            try:
              r=requests.get(url,timeout=30,headers={'User-Agent':'FlekDeck/1.0'})
              print('STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.content))
              print(r.text[:20000])
              try:
                data=r.json()
              except Exception:
                continue
              rows=data if isinstance(data,list) else data.get('data',[])
              for row in rows:
                if not isinstance(row,dict): continue
                link=row.get('install_url')
                if link:
                  try:
                    rr=requests.get(link,timeout=30,headers={'Range':'bytes=0-63','User-Agent':'SideStore/0.6'},allow_redirects=True)
                    print('APP',row.get('app_id'),row.get('app_name'),'LINK',link)
                    print('  STATUS',rr.status_code,'FINAL',rr.url,'TYPE',rr.headers.get('content-type'),'LEN',rr.headers.get('content-length'),'MAGIC',rr.content[:32])
                  except Exception as e:
                    print('  LINK_ERR',repr(e))
            except Exception as e:
              print('ERR',repr(e))
          PY
