name: Bootstrap project

on:
  push:
    branches: [feature/full-converter-app]
    paths: [bootstrap_payload.retry]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project payload
        run: |
          cat bootstrap_payload.part* | base64 -d > /tmp/project.tgz
          tar -xzf /tmp/project.tgz
          rm -f .github/workflows/convert.yml
          rm -f bootstrap_payload.b64 bootstrap_payload.part* bootstrap_payload.ready bootstrap_payload.retry .github/workflows/bootstrap.yml
      - name: Commit project
        run: |
          git config user.name "DebtoIPA Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: build full DebtoIPA web app and conversion runner"
          git push origin HEAD:${GITHUB_REF_NAME}
