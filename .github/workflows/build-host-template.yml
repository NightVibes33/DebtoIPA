name: Build Compatibility Host Template

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CompatibilityHost/**'
      - 'scripts/build_compatibility_host.sh'
      - '.github/workflows/build-host-template.yml'

permissions:
  contents: write

concurrency:
  group: compatibility-host-template
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build unsigned compatibility host
        run: bash scripts/build_compatibility_host.sh output

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: DebToIPA-CompatibilityHost-template
          path: output/DebToIPA-CompatibilityHost-template.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish stable template release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: compat-host-v1
          ASSET: output/DebToIPA-CompatibilityHost-template.ipa
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "DebToIPA Compatibility Host v1" \
              --notes "Precompiled unsigned stock-iOS host used by DebToIPA Smart Auto. The browser injects a translated PortManifest and safe package resources into this template."
          fi
