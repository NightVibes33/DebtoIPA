name: Apply UI patch

on:
  push:
    branches: [feature/full-converter-app]
    paths: [.github/patches/ui-download.patch]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply protected-download patch
        run: |
          git apply --check .github/patches/ui-download.patch
          git apply .github/patches/ui-download.patch
          rm .github/patches/ui-download.patch
      - name: Commit patch
        run: |
          git config user.name "DebtoIPA Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: support authenticated artifact downloads"
          git push origin HEAD:${GITHUB_REF_NAME}
