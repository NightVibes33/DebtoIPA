name: Refresh FlekSt0re AltSource

on:
  push:
    branches: [flekstore-alt-source]
    paths-ignore:
      - source.json
      - sidestore-source.json
      - flekstore-api-sample.json
      - ipa-metadata-cache.json
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flekstore-alt-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests jsonschema remotezip

      - name: Build FlekSt0re catalog
        run: |
          python tools/flekstore_alt_source.py
          python tools/resolve_ipa_metadata.py
          python tools/make_sidestore_safe.py

      - name: Validate both feeds
        run: |
          python -m json.tool source.json >/dev/null
          python -m json.tool sidestore-source.json >/dev/null
          python - <<'PY'
          import json,requests
          from collections import Counter
          from jsonschema import Draft7Validator
          schema=requests.get('https://raw.githubusercontent.com/SideStore/sidestore-source-types/main/schema.json',timeout=30).json()
          for path in ('source.json','sidestore-source.json'):
              s=json.load(open(path))
              errs=list(Draft7Validator(schema).iter_errors(s))
              assert not errs, '\n'.join(str(e) for e in errs[:20])
              assert isinstance(s.get('apps'),list) and s['apps']
              for app in s['apps']:
                  assert app.get('bundleIdentifier')
                  assert app.get('downloadURL')
                  assert app.get('versions') and app['versions'][0].get('downloadURL')
              counts=Counter(a['bundleIdentifier'] for a in s['apps'])
              dupes={k:v for k,v in counts.items() if v>1}
              print(path,'validated',len(s['apps']),'apps; duplicate bundle IDs',len(dupes))
          PY

      - name: Commit refreshed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source.json sidestore-source.json flekstore-api-sample.json ipa-metadata-cache.json
          if git diff --cached --quiet; then
            echo 'No catalog changes'
          else
            git commit -m 'Refresh FlekSt0re AltSource'
            git push origin HEAD:flekstore-alt-source
          fi
