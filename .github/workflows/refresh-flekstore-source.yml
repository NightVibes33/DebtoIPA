name: Refresh FlekSt0re AltSource

on:
  push:
    branches: [flekstore-alt-source]
    paths-ignore:
      - source.json
      - flekstore-api-sample.json
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flekstore-alt-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Build AltSource JSON
        run: python tools/flekstore_alt_source.py

      - name: Validate SideStore-compatible JSON
        run: |
          python -m json.tool source.json >/dev/null
          python - <<'PY'
          import json
          s=json.load(open('source.json'))
          allowed_source={'name','identifier','apps','news','sourceURL'}
          assert not (set(s)-allowed_source), f"invalid source keys: {set(s)-allowed_source}"
          assert isinstance(s.get('apps'), list) and s['apps']
          for app in s['apps']:
              assert app.get('bundleIdentifier')
              assert app.get('downloadURL'), f"legacy downloadURL missing: {app.get('name')}"
              assert app.get('versions')
              assert app['versions'][0].get('downloadURL')
              assert 'screenshots' not in app
          print('validated SideStore compatibility for', len(s['apps']), 'apps')
          PY

      - name: Commit refreshed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source.json flekstore-api-sample.json
          if git diff --cached --quiet; then
            echo 'No catalog changes'
          else
            git commit -m 'Refresh FlekSt0re AltSource'
            git push origin HEAD:flekstore-alt-source
          fi
