name: Refresh FlekSt0re AltSource

on:
  push:
    branches: [flekstore-alt-source]
    paths-ignore:
      - source.json
      - sidestore-source.json
      - sidestore-v6.json
      - sidestore-v7.json
      - sidestore-lean.json
      - sidestore-smoke-1.json
      - sidestore-smoke-25.json
      - sidestore-smoke-100.json
      - sidestore-strict.json
      - sidestore-strict-lite.json
      - flekstore-api-sample.json
      - ipa-metadata-cache.json
      - missing-app-diagnostics.json
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flekstore-alt-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests jsonschema remotezip

      - name: Build FlekSt0re catalog
        run: |
          python tools/flekstore_alt_source.py
          python tools/resolve_ipa_metadata.py
          python tools/make_sidestore_safe.py
          cp sidestore-source.json sidestore-v7.json
          python tools/make_sidestore_strict.py
          python tools/diagnose_missing_flekstore.py

      - name: Validate feeds
        run: |
          for f in \
            source.json \
            sidestore-source.json \
            sidestore-v7.json \
            sidestore-lean.json \
            sidestore-smoke-1.json \
            sidestore-smoke-25.json \
            sidestore-smoke-100.json \
            sidestore-strict.json \
            sidestore-strict-lite.json \
            missing-app-diagnostics.json; do
            python -m json.tool "$f" >/dev/null
          done
          python - <<'PY'
          import json,requests
          from collections import Counter
          from jsonschema import Draft7Validator

          schema=requests.get(
              'https://raw.githubusercontent.com/SideStore/sidestore-source-types/main/schema.json',
              timeout=30,
          ).json()
          paths=(
              'source.json',
              'sidestore-source.json',
              'sidestore-v7.json',
              'sidestore-lean.json',
              'sidestore-smoke-1.json',
              'sidestore-smoke-25.json',
              'sidestore-smoke-100.json',
              'sidestore-strict.json',
              'sidestore-strict-lite.json',
          )
          for path in paths:
              s=json.load(open(path))
              errs=list(Draft7Validator(schema).iter_errors(s))
              assert not errs, '\n'.join(str(e) for e in errs[:20])
              assert isinstance(s.get('apps'),list) and s['apps']
              for app in s['apps']:
                  assert app.get('bundleIdentifier')
                  assert app.get('downloadURL')
                  assert app.get('versions') and app['versions'][0].get('downloadURL')
                  if path.startswith('sidestore'):
                      assert 0 <= app['versions'][0]['size'] <= 2147483647
                  if path in ('sidestore-source.json','sidestore-v7.json'):
                      assert len(app['versions'][0]['date']) == 10
                      assert app.get('version') == app['versions'][0]['version']
                      assert app.get('versionDate') == app['versions'][0]['date']
                      assert app.get('size') == app['versions'][0]['size']
                  if path == 'sidestore-lean.json' or 'smoke-' in path:
                      assert len(app['versions'][0]['date']) == 10
              counts=Counter(a['bundleIdentifier'] for a in s['apps'])
              dupes={k:v for k,v in counts.items() if v>1}
              print(path,'validated',len(s['apps']),'apps; duplicate listing IDs',len(dupes))
              if path.startswith('sidestore'):
                  assert not dupes, f'{path} has duplicate listing IDs: {dupes}'
              if path in ('sidestore-strict.json','sidestore-strict-lite.json'):
                  bad=[a['bundleIdentifier'] for a in s['apps'] if a['bundleIdentifier'].startswith(
                      ('com.flekstore.catalog.','com.nightvibes33.flekvariant.')
                  ) or '.flekvariant.' in a['bundleIdentifier']]
                  assert not bad, f'{path} contains synthetic identities: {bad[:20]}'

          full=json.load(open('source.json'))
          safe=json.load(open('sidestore-source.json'))
          lean=json.load(open('sidestore-lean.json'))
          assert len(safe['apps']) == len(full['apps'])
          assert len(lean['apps']) == len(full['apps'])
          assert len(json.load(open('sidestore-smoke-1.json'))['apps']) == 1
          assert len(json.load(open('sidestore-smoke-25.json'))['apps']) == 25
          assert len(json.load(open('sidestore-smoke-100.json'))['apps']) == 100
          PY

      - name: Commit refreshed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            source.json \
            sidestore-source.json \
            sidestore-v7.json \
            sidestore-lean.json \
            sidestore-smoke-1.json \
            sidestore-smoke-25.json \
            sidestore-smoke-100.json \
            sidestore-strict.json \
            sidestore-strict-lite.json \
            flekstore-api-sample.json \
            ipa-metadata-cache.json \
            missing-app-diagnostics.json
          if git diff --cached --quiet; then
            echo 'No catalog changes'
          else
            git commit -m 'Refresh FlekSt0re AltSource'
            git push origin HEAD:flekstore-alt-source
          fi
