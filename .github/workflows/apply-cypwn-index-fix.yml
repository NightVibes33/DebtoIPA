name: Apply CyPwn Index Fix

on:
  push:
    branches: [feature/in-app-deb-library]
    paths:
      - '.github/workflows/apply-cypwn-index-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/in-app-deb-library
          fetch-depth: 1

      - name: Apply and validate decoder patch
        run: |
          python3 scripts/apply_cypwn_decoder_fix.py
          python3 -m unittest tests.test_deb_library -v
          python3 -m py_compile scripts/sync_deb_library.py
          git diff --check

      - name: Commit decoder fix
        run: |
          set -euo pipefail
          rm scripts/apply_cypwn_decoder_fix.py
          git config user.name 'DebToIPA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/sync_deb_library.py tests/test_deb_library.py scripts/apply_cypwn_decoder_fix.py
          git commit -m 'Support CyPwn Zstandard package indexes'
          git push origin HEAD:feature/in-app-deb-library
