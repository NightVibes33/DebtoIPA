name: Release Bootstrap

on:
  push:
    branches: [release-bootstrap]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/multi-profile-stock-ios
          fetch-depth: 1

      - name: Patch and upload corrected adapter blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/adapter_sdk.py')
          text = path.read_text(encoding='utf-8')
          old = '''    public var body: some View { NavigationStack { content.navigationTitle("__APP_NAME__") } }'''
          new = '''    public var body: some View {
              NavigationView { content.navigationTitle("__APP_NAME__") }
                  .navigationViewStyle(StackNavigationViewStyle())
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one NavigationStack wrapper, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python3 -m py_compile scripts/adapter_sdk.py
          python3 -m unittest tests.test_capability_graph

          blob_sha="$(python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          content = base64.b64encode(pathlib.Path('scripts/adapter_sdk.py').read_bytes()).decode('ascii')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',
              data=json.dumps({'content': content, 'encoding': 'base64'}).encode('utf-8'),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request) as response:
              print(json.load(response)['sha'])
          PY
          )"
          echo "DEBTOIPA_ADAPTER_BLOB=${blob_sha}"
