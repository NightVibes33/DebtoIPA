name: Release Bootstrap

on:
  push:
    branches: [release-bootstrap]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build consolidated release commit
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA256: 12988cfa5585c962cd188211620608640c1ae1095ce3a0bc38bc1a6e692babb0
        run: |
          set -euo pipefail
          : > /tmp/release.b64
          for blob in \
            2791132a845b9735d2ac1f5efd56691dac764af0 \
            def2c76cf5d9d7da327786dcfa5e8fe5e6d975eb \
            da7abea8e2c873c6828e8176e71e3eb264f3e3ff \
            692d0c3662f02ed7f0d146b87595c2130a786163 \
            8006c3d3f2b55c4a075a88410c84487c5fb72a82 \
            9f4f5cbdaa44f75825971b4059c36d28709c53e7 \
            9cfd2039c1b72ef817f8e276e42a1f96ef3dca6c \
            eaff4b25e4a420b341b3d48f8cbf1cad3bd37743
          do
            gh api --header "Accept: application/vnd.github.raw+json" "/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" >> /tmp/release.b64
          done
          tr -d '\r\n' < /tmp/release.b64 | base64 --decode > /tmp/debtoipa-release.tar.gz
          echo "${ARCHIVE_SHA256}  /tmp/debtoipa-release.tar.gz" | sha256sum --check -

          git fetch origin main
          git checkout -B feature/multi-profile-stock-ios origin/main
          tar -xzf /tmp/debtoipa-release.tar.gz -C .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          git config user.name "DebToIPA Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/convert.yml .github/workflows/public-convert.yml README.md public/github-runner.html public/public-runner.html scripts/adapter_sdk.py scripts/binary_shim.py scripts/capability_graph.py scripts/runner_full_auto.py scripts/source_port.py tests/macos_full_matrix.py tests/test_capability_graph.py

          git diff --cached --check
          test "$(git rev-list --count origin/main..HEAD)" -eq 0
          git commit -m "Add full multi-profile jailbreak-to-stock iOS conversion"
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          git push --force origin HEAD:refs/heads/feature/multi-profile-stock-ios
