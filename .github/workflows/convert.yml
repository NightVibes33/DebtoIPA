name: Convert DEB to IPA
run-name: DebToIPA • ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public Vercel Blob URL for the Debian package
        required: true
        type: string
      source_name:
        description: Original filename
        required: true
        type: string
      target_device:
        description: Target device family
        required: true
        default: universal
        type: choice
        options: [universal, iphone, ipad]
      minimum_ios:
        description: Minimum iOS version
        required: true
        default: "15.0"
        type: string
      bundle_id:
        description: Optional bundle identifier override
        required: false
        type: string
      display_name:
        description: Optional display name override
        required: false
        type: string
      job_id:
        description: Web application job identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: debtoipa-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  smart-auto:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout DebToIPA
        uses: actions/checkout@v6

      - name: Validate upload URL
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          value = urlparse(os.environ['SOURCE_URL'])
          host = value.hostname or ''
          allowed = value.scheme == 'https' and (host == 'public.blob.vercel-storage.com' or host.endswith('.public.blob.vercel-storage.com'))
          if not allowed:
              raise SystemExit('Refusing a source URL outside Vercel public Blob storage.')
          PY

      - name: Download Debian package
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          mkdir -p work output
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 900 \
            --output work/input.deb "$SOURCE_URL"
          python3 - <<'PY'
          from pathlib import Path
          source = Path('work/input.deb')
          size = source.stat().st_size
          if size <= 0:
              raise SystemExit('Downloaded package is empty.')
          if size > 750 * 1024 * 1024:
              raise SystemExit('Downloaded package exceeds the 750 MB limit.')
          if source.read_bytes()[:8] != b'!<arch>\n':
              raise SystemExit('Downloaded file is not a Debian ar archive.')
          print(f'Downloaded {size} bytes')
          PY

      - name: Audit package and choose build path
        run: echo "Smart Auto will attempt Direct IPA, then compile a replacement host when the original binary is blocked."

      - name: Build and validate IPA
        id: convert
        continue-on-error: true
        env:
          TARGET_DEVICE: ${{ inputs.target_device }}
          MINIMUM_IOS: ${{ inputs.minimum_ios }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          SOURCE_NAME: ${{ inputs.source_name }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set +e
          python3 scripts/runner_smart_auto.py \
            --deb work/input.deb \
            --output-dir output \
            --job-id "$JOB_ID" \
            --source-name "$SOURCE_NAME" \
            --device "$TARGET_DEVICE" \
            --minimum-ios "$MINIMUM_IOS" \
            --bundle-id "$BUNDLE_ID" \
            --display-name "$DISPLAY_NAME"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish runner summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          path = pathlib.Path('output/runner-summary.json')
          summary = json.loads(path.read_text()) if path.exists() else {'verdict':'failed','error':'Runner produced no summary.'}
          lines = [
              '# DebToIPA Smart Auto',
              f"- Job: `{os.environ.get('JOB_ID', '')}`",
              f"- Verdict: **{summary.get('verdict', 'unknown')}**",
              f"- Feature complete: **{summary.get('featureComplete', False)}**",
              f"- Generated IPA files: **{len(summary.get('ipas') or [])}**",
          ]
          if summary.get('error'):
              lines += ['', '## Error', str(summary['error'])]
          if summary.get('warnings'):
              lines += ['', '## Warnings'] + [f"- {item}" for item in summary['warnings']]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY
        env:
          JOB_ID: ${{ inputs.job_id }}

      - name: Upload IPA, Port Project, and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DebtoIPA-${{ inputs.job_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Fail unusable build
        if: steps.convert.outputs.exit_code != '0'
        run: exit 1
