name: Convert DEB to IPA
run-name: DebToIPA • ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      source_kind:
        description: Package transport
        required: true
        default: git_chunks
        type: choice
        options: [git_chunks, vercel_blob]
      source_url:
        description: Public Vercel Blob URL when source_kind is vercel_blob
        required: false
        type: string
      upload_ref:
        description: Temporary upload branch when source_kind is git_chunks
        required: false
        type: string
      upload_prefix:
        description: Package chunk directory in the temporary branch
        required: false
        type: string
      source_name:
        description: Original filename
        required: true
        type: string
      target_device:
        description: Target device family
        required: true
        default: universal
        type: choice
        options: [universal, iphone, ipad]
      minimum_ios:
        description: Minimum iOS version
        required: true
        default: "15.0"
        type: string
      bundle_id:
        description: Optional bundle identifier override
        required: false
        type: string
      display_name:
        description: Optional display name override
        required: false
        type: string
      conversion_profile:
        description: Conversion strategy
        required: true
        default: automatic
        type: choice
        options: [automatic, direct-ipa, binary-shims, source-rebuild, app-extensions, background-replacement, companion-service, report-only]
      alternatives:
        description: Optional comma-separated normal-iOS alternatives
        required: false
        default: preferences-adapter,sandbox-path-adapter,notification-adapter
        type: string
      job_id:
        description: Web application job identifier
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: debtoipa-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  full-auto:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout DebToIPA
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Acquire Debian package
        env:
          SOURCE_KIND: ${{ inputs.source_kind }}
          SOURCE_URL: ${{ inputs.source_url }}
          UPLOAD_REF: ${{ inputs.upload_ref }}
          UPLOAD_PREFIX: ${{ inputs.upload_prefix }}
        run: |
          set -euo pipefail
          mkdir -p work output
          if [[ "$SOURCE_KIND" == "vercel_blob" ]]; then
            python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          value = urlparse(os.environ['SOURCE_URL'])
          host = value.hostname or ''
          allowed = value.scheme == 'https' and (host == 'public.blob.vercel-storage.com' or host.endswith('.public.blob.vercel-storage.com'))
          if not allowed:
              raise SystemExit('Refusing a source URL outside Vercel public Blob storage.')
          PY
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 900 --output work/input.deb "$SOURCE_URL"
          elif [[ "$SOURCE_KIND" == "git_chunks" ]]; then
            python3 - <<'PY'
          import os, re
          ref = os.environ['UPLOAD_REF']
          prefix = os.environ['UPLOAD_PREFIX']
          if not re.fullmatch(r'debtoipa-upload-[A-Za-z0-9_-]{4,80}', ref):
              raise SystemExit('Invalid temporary upload branch.')
          if not re.fullmatch(r'uploads/[A-Za-z0-9_-]{4,80}', prefix):
              raise SystemExit('Invalid temporary upload path.')
          PY
            git fetch --no-tags --depth=1 origin "refs/heads/${UPLOAD_REF}:refs/remotes/origin/${UPLOAD_REF}"
            python3 - <<'PY'
          import json, os, pathlib, subprocess
          ref = f"origin/{os.environ['UPLOAD_REF']}"
          prefix = os.environ['UPLOAD_PREFIX']
          manifest = json.loads(subprocess.check_output(['git', 'show', f'{ref}:{prefix}/manifest.json']))
          parts = manifest.get('parts')
          if not isinstance(parts, list) or not parts or len(parts) > 64:
              raise SystemExit('Upload manifest has an invalid part list.')
          expected = int(manifest.get('size') or 0)
          if expected <= 0 or expected > 750 * 1024 * 1024:
              raise SystemExit('Upload manifest size is invalid.')
          output = pathlib.Path('work/input.deb')
          with output.open('wb') as handle:
              for index, item in enumerate(parts):
                  path = str(item.get('path') if isinstance(item, dict) else '')
                  expected_path = f'{prefix}/parts/{index:04d}.bin'
                  if path != expected_path:
                      raise SystemExit(f'Unexpected upload part path: {path}')
                  process = subprocess.run(['git', 'show', f'{ref}:{path}'], stdout=handle)
                  if process.returncode:
                      raise SystemExit(f'Could not retrieve upload part {index}.')
          if output.stat().st_size != expected:
              raise SystemExit('Reconstructed size mismatch.')
          PY
          else
            echo "Unsupported source_kind: $SOURCE_KIND" >&2
            exit 2
          fi

      - name: Validate package and options
        env:
          ALTERNATIVES: ${{ inputs.alternatives }}
          PROFILE: ${{ inputs.conversion_profile }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('work/input.deb')
          size = source.stat().st_size
          if size <= 0 or size > 750 * 1024 * 1024:
              raise SystemExit('Downloaded package size is invalid.')
          if source.read_bytes()[:8] != b'!<arch>\n':
              raise SystemExit('Downloaded file is not a Debian archive.')
          allowed = {
              'preferences-adapter', 'settings-screen', 'sandbox-path-adapter', 'document-picker',
              'file-provider', 'notification-adapter', 'push-notifications', 'background-task',
              'background-transfer', 'companion-service', 'widget-extension', 'standalone-ui',
              'share-extension', 'app-intents', 'url-schemes', 'safari-web-extension',
              'content-blocker', 'network-extension', 'local-proxy', 'native-library',
              'public-api-redesign',
          }
          alternatives = [value.strip() for value in os.environ.get('ALTERNATIVES', '').split(',') if value.strip()]
          if len(alternatives) > 20 or any(value not in allowed for value in alternatives):
              raise SystemExit('Invalid alternatives list.')
          print(f'Validated Debian archive: {size} bytes; profile={os.environ["PROFILE"]}; alternatives={alternatives}')
          PY

      - name: Analyze capabilities and run conversion profiles
        id: convert
        continue-on-error: true
        env:
          TARGET_DEVICE: ${{ inputs.target_device }}
          MINIMUM_IOS: ${{ inputs.minimum_ios }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          SOURCE_NAME: ${{ inputs.source_name }}
          JOB_ID: ${{ inputs.job_id }}
          PROFILE: ${{ inputs.conversion_profile }}
          ALTERNATIVES: ${{ inputs.alternatives }}
        run: |
          set +e
          args=()
          IFS=',' read -ra values <<< "$ALTERNATIVES"
          for value in "${values[@]}"; do
            value="${value//[[:space:]]/}"
            [[ -n "$value" ]] && args+=(--alternative "$value")
          done
          python3 scripts/runner_full_auto.py \
            --deb work/input.deb \
            --output-dir output \
            --job-id "$JOB_ID" \
            --source-name "$SOURCE_NAME" \
            --device "$TARGET_DEVICE" \
            --minimum-ios "$MINIMUM_IOS" \
            --bundle-id "$BUNDLE_ID" \
            --display-name "$DISPLAY_NAME" \
            --profile "$PROFILE" \
            "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish runner summary
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('output/runner-summary.json')
          summary = json.loads(path.read_text()) if path.exists() else {'resultKind':'unsupported','error':'Runner produced no summary.'}
          lines = [
              '# DebToIPA Multi-Profile Conversion',
              f"- Job: `{os.environ.get('JOB_ID', '')}`",
              f"- Result: **{summary.get('resultKind', 'unknown')}**",
              f"- Selected profile: **{summary.get('conversionProfile', 'unknown')}**",
              f"- Recommended profile: **{summary.get('recommendedProfile', 'unknown')}**",
              f"- Estimated retained functionality: **{summary.get('expectedRetainedFunctionality', 0)}%**",
              f"- Original binary packaged: **{summary.get('originalBinaryPackaged', False)}**",
              f"- Stock-iOS compile verified: **{summary.get('stockIOSCompileVerified', False)}**",
              f"- Behavioral parity verified: **{summary.get('behavioralParityVerified', False)}**",
              f"- Generated IPA files: **{len(summary.get('ipas') or [])}**",
          ]
          if summary.get('warnings'):
              lines += ['', '## Warnings'] + [f"- {item}" for item in summary['warnings']]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY

      - name: Upload IPAs, capability graph, adapters, extensions, and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DebtoIPA-${{ inputs.job_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Delete temporary upload branch
        if: always() && inputs.source_kind == 'git_chunks'
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_REF: ${{ inputs.upload_ref }}
        run: |
          if [[ "$UPLOAD_REF" =~ ^debtoipa-upload-[A-Za-z0-9_-]{4,80}$ ]]; then
            curl --fail-with-body --silent --show-error --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${UPLOAD_REF}" || true
          fi

      - name: Fail non-runnable result
        if: steps.convert.outputs.exit_code != '0'
        run: exit 1
