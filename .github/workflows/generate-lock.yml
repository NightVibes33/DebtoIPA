name: Generate npm lockfile

on:
  push:
    branches: [feature/full-converter-app]
    paths: [.github/lockfile.ready]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
          rm .github/lockfile.ready
      - name: Commit lockfile
        run: |
          git config user.name "DebtoIPA Builder"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json .github/lockfile.ready
          git commit -m "build: lock audited npm dependency graph"
          git push origin HEAD:${GITHUB_REF_NAME}
