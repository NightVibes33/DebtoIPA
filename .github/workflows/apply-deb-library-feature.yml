name: Apply In-App DEB Library Feature

on:
  push:
    branches: [feature/in-app-deb-library]
    paths:
      - '.github/workflows/apply-deb-library-feature.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/in-app-deb-library
          fetch-depth: 1

      - name: Verify and extract feature payload
        run: |
          set -euo pipefail
          {
            cat .release/deb-library/00.b64
            cat .release/deb-library/01.b64
            cat .release/deb-library/02.b64
            head -c 6000 .release/deb-library/03.b64
            cat .release/deb-library/04.b64
          } | base64 --decode > /tmp/deb-library-feature.tar.gz
          echo '24e7853a3792e4c5e698487ed1f0859f54cf3b94f3dd98513af38ee42ec7aa84  /tmp/deb-library-feature.tar.gz' | sha256sum --check --strict
          tar --exclude='.github/workflows/sync-deb-library.yml' -xzf /tmp/deb-library-feature.tar.gz
          rm -rf .release/deb-library
          python3 -m unittest tests.test_deb_library -v
          python3 -m py_compile scripts/sync_deb_library.py
          python3 -m json.tool library/sources.json >/dev/null
          python3 -m json.tool public/library/index.json >/dev/null
          test -f components/DebLibraryApp.tsx
          test -f app/api/library/package/route.ts
          grep -q 'CyPwn' library/sources.json
          grep -q "redirect('/library')" app/page.tsx

      - name: Commit complete feature tree
        run: |
          set -euo pipefail
          git config user.name 'DebToIPA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add in-app public DEB library'
          git push origin HEAD:feature/in-app-deb-library
